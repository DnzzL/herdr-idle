id = "dnzzl.idle"
name = "Idle"
version = "0.0.0"
min_herdr_version = "0.9.5"
description = "Puts idle agent panes asleep to free their memory; the pane stays in place with the resume command prefilled."
platforms = ["linux", "macos"]

[[build]]
command = ["go", "build", "-o", "bin/herdr-idle", "."]

[[events]]
on = "pane.closed"
command = ["./bin/herdr-idle", "pane-closed"]
