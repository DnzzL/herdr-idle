id = "dnzzl.idle"
name = "Idle"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Puts idle agent panes asleep to free their memory; the pane stays in place with the resume command prefilled."
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/install.sh"]

[[startup]]
command = ["./bin/herdr-idle", "daemon"]

# herdr runs [[startup]] only with its server: any focus change starts the
# daemon after an install, without a herdr restart.
[[events]]
on = "pane.focused"
command = ["./bin/herdr-idle", "ensure-daemon"]

# Closing a tab or workspace sends no pane.closed for the panes in it.
[[events]]
on = "pane.closed"
command = ["./bin/herdr-idle", "forget-closed"]

[[events]]
on = "tab.closed"
command = ["./bin/herdr-idle", "forget-closed"]

[[events]]
on = "workspace.closed"
command = ["./bin/herdr-idle", "forget-closed"]

[[actions]]
id = "idle-now"
title = "Idle: put quiet agents asleep now"
contexts = ["global"]
command = ["./bin/herdr-idle", "sweep"]

# Actions run without a terminal: these two open the panes below.
[[actions]]
id = "preview"
title = "Idle: preview which agents would sleep"
contexts = ["global"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin dnzzl.idle --entrypoint preview"]

[[actions]]
id = "config"
title = "Idle: edit config"
contexts = ["global"]
command = ["sh", "-c", "exec \"${HERDR_BIN_PATH:-herdr}\" plugin pane open --plugin dnzzl.idle --entrypoint config"]

[[panes]]
id = "preview"
title = "Idle: preview"
placement = "overlay"
command = ["./bin/herdr-idle", "preview", "--hold"]

[[panes]]
id = "config"
title = "Idle: config"
placement = "overlay"
command = ["./bin/herdr-idle", "config"]
